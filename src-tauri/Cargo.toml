[package]
name = "packit"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs", "aes-crypto"] }
cap-std = "4"
cap-fs-ext = "4"
crc32fast = "1"
unicode-normalization = "0.1"
zeroize = "1"
tempfile = "3"

tar = { version = '0.4', default-features = false }
flate2 = { version = '1', default-features = false, features = ['zlib-rs'] }
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls"] }
# TLS is enabled by the official updater plugin.
reqwest = { version = "0.13", default-features = false, features = ["stream"] }


[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
tempfile = "3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_System_RemoteDesktop", "Win32_Graphics_Gdi"] }

[target.'cfg(windows)'.dependencies]
windows-core = "0.62.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"



