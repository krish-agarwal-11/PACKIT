[package]
name = "packit-shell"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_SystemServices", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-core = "0.62.2"
serde_json = "1"
unicode-normalization = "0.1"
